<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Mesh — AST Matrix Engine & Systems Visualizer</title>
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="logo-group">
      <div class="logo-box">CM</div>
      <div class="title-wrap">
        <span class="app-title">Code Mesh</span>
        <span class="sub-title">AST Matrix Engine</span>
      </div>
      <span class="version-tag">C Core v1.0</span>
    </div>

    <div class="header-metrics">
      <div class="metric-item">
        <span class="metric-label">Matrices Found:</span>
        <span class="metric-val highlight" id="total-matrices">0</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Scanned Files:</span>
        <span class="metric-val" id="total-files">0</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Folders:</span>
        <span class="metric-val" id="total-folders">0</span>
      </div>
    </div>
  </header>

  <!-- Main Workspace Container -->
  <div class="ide-container">
    
    <!-- Left Sidebar: Project Explorer -->
    <aside class="sidebar-explorer">
      <div class="panel-header">
        <span>PROJECT EXPLORER</span>
        <button id="btn-refresh" title="Re-sync data from C engine">🔄 Refresh</button>
      </div>
      <div class="tree-viewport" id="tree-container">
        <div class="loading-state">Scanning workspace structure...</div>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <div class="viewport-tabs">
        <div class="tab active" id="tab-matrices">
          <span class="tab-icon">🔢</span>
          <span>Detected 2D Matrices</span>
          <span class="tab-badge" id="matrix-count-badge">0</span>
        </div>
        <div class="tab" id="tab-tree-summary">
          <span class="tab-icon">📁</span>
          <span>Workspace Tree Overview</span>
        </div>
      </div>

      <div class="canvas-area" id="canvas-area">
        <div class="loading-state">Fetching dynamic matrix data...</div>
      </div>
    </main>

  </div>

  <script src="app.js?v=6.0"></script>
</body>
</html>
